<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monumentum Cast Recruiter</title>
    <style>
        :root {
            --primary-colour: #2c3e50;
            --accent-colour: #d35400;
            --bg-colour: #f8f9fa;
            --panel-bg: #ffffff;
            --text-colour: #333333;
            --border-colour: #e0e0e0;
            --warning-colour: #c0392b;
            --success-colour: #27ae60;
            --radius: 12px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-colour);
            color: var(--text-colour);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--panel-bg);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }

        /* Responsive Grids */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 15px;
            margin-bottom: 30px;
            width: 100%;
        }

        /* Card Container (Wraps visual card + sub-controls like talisman selects) */
        .card-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        /* Visual Card */
        .visual-card {
            width: 100%;
            max-width: 260px;
            aspect-ratio: 1 / 1.4;
            border-radius: var(--radius);
            background-repeat: no-repeat;
            background-color: #222;
            border: 3px solid transparent;
            cursor: pointer;
            box-sizing: border-box;
            position: relative;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        .visual-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.25);
        }

        .visual-card.selected {
            border-color: var(--accent-colour);
            box-shadow: 0 0 12px var(--accent-colour);
        }

        /* Qty Input on Basic Familiars */
        .card-qty-input {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 32px;
            height: 32px;
            background-color: var(--accent-colour);
            color: white;
            border-radius: 50%;
            border: 2px solid white;
            text-align: center;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 10;
            outline: none;
            cursor: pointer;
            box-sizing: border-box;
            -webkit-appearance: none;
            margin: 0;
        }

        /* Hide spinner controls in input number fields */
        .card-qty-input::-webkit-outer-spin-button,
        .card-qty-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .card-qty-input[type=number] {
            -moz-appearance: textfield;
        }

        /* Floating status widget */
        .floating-status-widget {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2000;
            background: white;
            border: 2px solid var(--primary-colour);
            border-radius: var(--radius);
            padding: 12px 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            font-weight: bold;
        }

        .status-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .status-label {
            color: #7f8c8d;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }

        #ether-tracker, #specials-tracker {
            font-size: 1.25rem;
            color: var(--primary-colour);
            font-weight: bold;
        }

        /* Talisman Dropdown styling */
        .talisman-select {
            width: 100%;
            max-width: 170px;
            padding: 6px;
            font-size: 0.8rem;
            border-radius: var(--radius);
            border: 1px solid var(--border-colour);
            box-sizing: border-box;
            background-color: #fff;
        }

        /* Section dividers */
        .section {
            margin-bottom: 30px;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--border-colour);
        }

        .section:last-child {
            border-bottom: none;
        }

        h1 {
            text-align: center;
            color: var(--primary-colour);
            margin-top: 0;
            margin-bottom: 25px;
        }

        h2 {
            font-size: 1.4rem;
            color: var(--primary-colour);
            margin-bottom: 20px;
            border-bottom: 2px solid var(--primary-colour);
            padding-bottom: 5px;
        }

        h3 {
            font-size: 1.15rem;
            color: #555;
            margin-top: 20px;
            margin-bottom: 15px;
            border-left: 4px solid var(--primary-colour);
            padding-left: 10px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        select, button, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-colour);
            border-radius: var(--radius);
            font-size: 1rem;
            box-sizing: border-box;
        }

        select {
            margin-bottom: 15px;
            background-color: #fff;
        }

        .warning-box {
            background-color: #fadbd8;
            color: var(--warning-colour);
            padding: 15px;
            border-radius: var(--radius);
            margin-bottom: 25px;
            display: none;
            border: 1px solid #f1948a;
        }

        .btn-export {
            background-color: var(--accent-colour);
            color: white;
            font-size: 1.15rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 15px;
        }

        .btn-export:hover {
            background-color: #e67e22;
        }

        textarea {
            resize: vertical;
            min-height: 150px;
            font-family: monospace;
            background-color: #f8f9fa;
        }

        .loader {
            text-align: center;
            font-style: italic;
            color: #666;
            font-size: 1.1rem;
            margin: 40px 0;
        }

        .hidden {
            display: none !important;
        }
        
        .empty-message {
            font-style: italic;
            color: #7f8c8d;
            font-size: 0.95rem;
            grid-column: 1 / -1;
            text-align: center;
            margin: 15px 0;
        }

        @media (max-width: 1100px) {
            .floating-status-widget {
                position: sticky;
                top: 10px;
                right: auto;
                width: 100%;
                flex-direction: row;
                justify-content: space-around;
                box-sizing: border-box;
                margin-bottom: 20px;
                border-width: 1px;
            }
            .status-item {
                flex-direction: row;
                gap: 10px;
            }
            #ether-tracker, #specials-tracker {
                font-size: 1.1rem;
            }
        }

        @media (max-width: 900px) {
            .card-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 600px) {
            .card-grid {
                grid-template-columns: repeat(1, 1fr);
                justify-items: center;
            }
            .visual-card {
                max-width: 200px;
            }
        }
    </style>
</head>
<body>

<div class="floating-status-widget hidden" id="status-widget">
    <div class="status-item">
        <span class="status-label">Ether Limit</span>
        <span id="ether-tracker">0 / 40</span>
    </div>
    <div class="status-item">
        <span class="status-label">Specials Limit</span>
        <span id="specials-tracker">0 / 6</span>
    </div>
</div>

<div class="container">
    <h1>Monumentum Cast Recruiter</h1>

    <div id="loading" class="loader">Loading database...</div>

    <div id="app" class="hidden">
        <div class="section">
            <label for="dominion-select">Select Dominion</label>
            <select id="dominion-select">
                <option value="">-- Choose a Dominion --</option>
            </select>
        </div>

        <div id="builder-content" class="hidden">
            <div class="section">
                <h2>Select Champion</h2>
                <div id="champion-grid" class="card-grid"></div>
            </div>

            <div id="recruitment-section" class="section hidden">
                <h2>Recruitment</h2>
                
                <h3>Loyal Companions</h3>
                <div id="loyal-grid" class="card-grid"></div>

                <h3>Basic Familiars & Minions</h3>
                <div id="familiars-grid" class="card-grid"></div>

                <h3>Talismans</h3>
                <div id="talismans-grid" class="card-grid"></div>
            </div>

            <div id="specials-section" class="section hidden">
                <h2>Special Actions</h2>
                
                <div id="signature-container">
                    <h3>Signature Actions</h3>
                    <div id="signature-grid" class="card-grid"></div>
                </div>
                
                <div id="specials-container">
                    <h3>Special Actions</h3>
                    <div id="specials-grid" class="card-grid"></div>
                </div>
            </div>

            <div id="warnings" class="warning-box">
                <ul id="warnings-list" style="margin: 0; padding-left: 20px;"></ul>
            </div>

            <div class="section">
                <button id="btn-export" class="btn-export">Export Cast</button>
                <textarea id="export-output" readonly placeholder="Your exported JSON will appear here..."></textarea>
            </div>
        </div>
    </div>
</div>

<script>
    let db = {
        dominions: [],
        champions: [],
        units: [],
        specials: []
    };

    let state = {
        dominion: "",
        champion: "",
        familiars: {},   // Format: { unitId: quantity }
        talismans: {},   // Format: { talismanId: attachedFamiliarId_or_empty_string }
        specials: []     // Format: [id, id]
    };

    const MAX_ETHER = 40;
    const MAX_SPECIALS = 6;

    const els = {
        loading: document.getElementById('loading'),
        app: document.getElementById('app'),
        dominionSelect: document.getElementById('dominion-select'),
        builderContent: document.getElementById('builder-content'),
        championGrid: document.getElementById('champion-grid'),
        recruitmentSection: document.getElementById('recruitment-section'),
        loyalGrid: document.getElementById('loyal-grid'),
        familiarsGrid: document.getElementById('familiars-grid'),
        talismansGrid: document.getElementById('talismans-grid'),
        specialsSection: document.getElementById('specials-section'),
        signatureContainer: document.getElementById('signature-container'),
        signatureGrid: document.getElementById('signature-grid'),
        specialsGrid: document.getElementById('specials-grid'),
        etherTracker: document.getElementById('ether-tracker'),
        specialsTracker: document.getElementById('specials-tracker'),
        warningsBox: document.getElementById('warnings'),
        warningsList: document.getElementById('warnings-list'),
        btnExport: document.getElementById('btn-export'),
        exportOutput: document.getElementById('export-output'),
        statusWidget: document.getElementById('status-widget')
    };

    function initialise() {
        console.log("1. Initialise called. Attempting to contact backend...");
        
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(function(data) {
                    console.log("2. Success! Data received from backend:", data);
                    db = data;
                    renderDominions();
                    showApp();
                })
                .withFailureHandler(function(error) {
                    console.error("2. Backend transfer failed:", error);
                    els.loading.textContent = "Error loading database: " + error.message;
                })
                .getCardDatabase();
        } else {
            console.error("Error: Google Apps Script API not found.");
            els.loading.textContent = "Error: Google Apps Script environment not detected.";
        }
    }

    // Use window 'load' instead of 'DOMContentLoaded' as it is more reliable in Google Web Apps
    window.addEventListener('load', initialise);

    function showApp() {
        els.loading.classList.add('hidden');
        els.app.classList.remove('hidden');
    }

    function renderDominions() {
        els.dominionSelect.innerHTML = '<option value="">-- Choose a Dominion --</option>';
        db.dominions.forEach(dom => {
            const opt = document.createElement('option');
            opt.value = dom;
            opt.textContent = dom;
            els.dominionSelect.appendChild(opt);
        });

        els.dominionSelect.addEventListener('change', (e) => {
            state.dominion = e.target.value;
            state.champion = "";
            state.familiars = {};
            state.talismans = {};
            state.specials = [];
            
            if (state.dominion) {
                els.builderContent.classList.remove('hidden');
                els.statusWidget.classList.remove('hidden');
                renderChampions();
                renderAllUnits();
                renderSpecials();
                els.recruitmentSection.classList.add('hidden');
                els.specialsSection.classList.add('hidden');
            } else {
                els.builderContent.classList.add('hidden');
                els.statusWidget.classList.add('hidden');
            }
            updateTrackers();
        });
    }

    function renderChampions() {
        els.championGrid.innerHTML = '';
        if (!state.dominion) return;

        const availableChamps = db.champions.filter(c => c.dominion === state.dominion);
        
        availableChamps.forEach(champ => {
            const container = document.createElement('div');
            container.className = 'card-container';

            const isSelected = state.champion === champ.id;
            
            const cardEl = document.createElement('div');
            cardEl.className = `visual-card ${isSelected ? 'selected' : ''}`;
            cardEl.style.cssText = getCardStyle(champ);
            cardEl.setAttribute('title', champ.name);
            
            cardEl.addEventListener('click', () => {
                state.champion = champ.id;
                state.familiars = {};
                state.talismans = {};
                state.specials = [];
                
                renderChampions();
                renderAllUnits();
                renderSpecials();
                updateTrackers();
                
                els.recruitmentSection.classList.remove('hidden');
                els.specialsSection.classList.remove('hidden');
            });

            container.appendChild(cardEl);
            els.championGrid.appendChild(container);
        });

        // Hide recruitment if champ is cleared
        if (!state.champion) {
            els.recruitmentSection.classList.add('hidden');
            els.specialsSection.classList.add('hidden');
        } else {
            els.recruitmentSection.classList.remove('hidden');
            els.specialsSection.classList.remove('hidden');
        }
    }

    function calculateCurrentEther() {
        let total = 0;
        
        for (const [id, qty] of Object.entries(state.familiars)) {
            const item = db.units.find(u => u.id === id);
            if (item) total += ((item.cost || 0) * qty);
        }

        for (const [id, attached] of Object.entries(state.talismans)) {
            const item = db.units.find(u => u.id === id);
            if (item) total += (item.cost || 0);
        }
        
        return total;
    }

    function renderAllUnits() {
        renderLoyals();
        renderBasics();
        renderTalismans();
    }

    function renderLoyals() {
        els.loyalGrid.innerHTML = '';
        if (!state.dominion || !state.champion) return;

        const loyals = db.units.filter(u => u.dominion === state.dominion && u.isLoyal && u.tiedChampionId === state.champion && u.cost > 0);
        
        if (loyals.length === 0) {
            els.loyalGrid.innerHTML = '<span class="empty-message">No loyal companions for this champion.</span>';
            return;
        }

        const currentEther = calculateCurrentEther();

        loyals.forEach(item => {
            const container = document.createElement('div');
            container.className = 'card-container';

            const isSelected = state.familiars.hasOwnProperty(item.id);
            const cost = item.cost || 0;
            const canAdd = isSelected || (currentEther + cost) <= MAX_ETHER;

            const cardEl = document.createElement('div');
            cardEl.className = `visual-card ${isSelected ? 'selected' : ''}`;
            cardEl.style.cssText = getCardStyle(item);
            cardEl.setAttribute('title', `${item.name} (Cost: ${cost} Ether)`);

            if (!canAdd && !isSelected) {
                cardEl.style.opacity = '0.4';
                cardEl.style.cursor = 'not-allowed';
            }

            cardEl.addEventListener('click', () => {
                if (isSelected) {
                    delete state.familiars[item.id];
                    cleanUpTalismanAttachments(item.id);
                } else {
                    if (!canAdd) return;
                    state.familiars[item.id] = 1;
                }
                renderAllUnits();
                updateTrackers();
            });

            container.appendChild(cardEl);
            els.loyalGrid.appendChild(container);
        });
    }

    function renderBasics() {
        els.familiarsGrid.innerHTML = '';
        if (!state.dominion || !state.champion) return;

        const basics = db.units.filter(u => u.dominion === state.dominion && !u.isLoyal && (u.class === 'Familiar' || u.class === 'Minion') && u.cost > 0);
        
        if (basics.length === 0) {
            els.familiarsGrid.innerHTML = '<span class="empty-message">No basic familiars found.</span>';
            return;
        }

        const currentEther = calculateCurrentEther();

        basics.forEach(item => {
            const container = document.createElement('div');
            container.className = 'card-container';

            const qty = state.familiars[item.id] || 0;
            const cost = item.cost || 0;
            const canAdd = qty < 3 && (currentEther + cost) <= MAX_ETHER;

            const cardEl = document.createElement('div');
            cardEl.className = `visual-card ${qty > 0 ? 'selected' : ''}`;
            cardEl.style.cssText = getCardStyle(item);
            cardEl.setAttribute('title', `${item.name} (Cost: ${cost} Ether)`);

            // Qty input badge
            const qtyInput = document.createElement('input');
            qtyInput.type = 'number';
            qtyInput.className = 'card-qty-input';
            qtyInput.min = '0';
            qtyInput.max = '3';
            qtyInput.value = qty;
            qtyInput.title = 'Edit quantity directly';

            qtyInput.addEventListener('click', (e) => {
                e.stopPropagation();
            });

            qtyInput.addEventListener('change', (e) => {
                let newVal = parseInt(e.target.value) || 0;
                if (newVal < 0) newVal = 0;
                if (newVal > 3) newVal = 3;

                const originalQty = state.familiars[item.id] || 0;
                const qtyDiff = newVal - originalQty;
                const addedCost = qtyDiff * cost;

                if (qtyDiff > 0 && (calculateCurrentEther() + addedCost) > MAX_ETHER) {
                    alert("Not enough Ether to set that quantity!");
                    e.target.value = originalQty;
                    return;
                }

                if (newVal === 0) {
                    delete state.familiars[item.id];
                    cleanUpTalismanAttachments(item.id);
                } else {
                    state.familiars[item.id] = newVal;
                }
                
                renderAllUnits();
                updateTrackers();
            });

            cardEl.appendChild(qtyInput);

            cardEl.addEventListener('click', () => {
                let nextQty = (qty + 1) % 4; // Cycles: 0 -> 1 -> 2 -> 3 -> 0

                if (nextQty > qty) {
                    const addedCost = (nextQty - qty) * cost;
                    if ((calculateCurrentEther() + addedCost) > MAX_ETHER) {
                        alert("Not enough Ether!");
                        return;
                    }
                }

                if (nextQty === 0) {
                    delete state.familiars[item.id];
                    cleanUpTalismanAttachments(item.id);
                } else {
                    state.familiars[item.id] = nextQty;
                }

                renderAllUnits();
                updateTrackers();
            });

            container.appendChild(cardEl);
            els.familiarsGrid.appendChild(container);
        });
    }

    function renderTalismans() {
        els.talismansGrid.innerHTML = '';
        if (!state.dominion || !state.champion) return;

        const talismans = db.units.filter(u => u.dominion === state.dominion && u.class === 'Talisman' && u.cost > 0);
        
        if (talismans.length === 0) {
            els.talismansGrid.innerHTML = '<span class="empty-message">No talismans found.</span>';
            return;
        }

        const currentEther = calculateCurrentEther();

        talismans.forEach(talisman => {
            const container = document.createElement('div');
            container.className = 'card-container';

            const isSelected = state.talismans.hasOwnProperty(talisman.id);
            const cost = talisman.cost || 0;
            const canAdd = isSelected || (currentEther + cost) <= MAX_ETHER;

            const cardEl = document.createElement('div');
            cardEl.className = `visual-card ${isSelected ? 'selected' : ''}`;
            cardEl.style.cssText = getCardStyle(talisman);
            cardEl.setAttribute('title', `${talisman.name} (Cost: ${cost} Ether)`);

            if (!canAdd && !isSelected) {
                cardEl.style.opacity = '0.4';
                cardEl.style.cursor = 'not-allowed';
            }

            cardEl.addEventListener('click', () => {
                if (isSelected) {
                    delete state.talismans[talisman.id];
                } else {
                    if (!canAdd) return;
                    state.talismans[talisman.id] = "";
                }
                renderAllUnits();
                updateTrackers();
            });

            container.appendChild(cardEl);

            if (isSelected) {
                const selectEl = document.createElement('select');
                selectEl.className = 'talisman-select';
                selectEl.setAttribute('data-talisman-id', talisman.id);
                
                const currentSelection = state.talismans[talisman.id] || "";
                selectEl.innerHTML = '<option value="">-- Attached to --</option>';
                
                const recruitedBasics = getRecruitedBasicFamiliars();
                recruitedBasics.forEach(fam => {
                    const opt = document.createElement('option');
                    opt.value = fam.id;
                    opt.textContent = fam.name;
                    if (fam.id === currentSelection) {
                        opt.selected = true;
                    }
                    selectEl.appendChild(opt);
                });

                selectEl.addEventListener('change', (e) => {
                    state.talismans[talisman.id] = e.target.value;
                    updateTrackers();
                });

                container.appendChild(selectEl);
            }

            els.talismansGrid.appendChild(container);
        });
    }

    function getRecruitedBasicFamiliars() {
        const recruited = [];
        for (const id in state.familiars) {
            const item = db.units.find(u => u.id === id);
            if (item && !item.isLoyal && item.class === 'Familiar') {
                recruited.push(item);
            }
        }
        return recruited;
    }

    function cleanUpTalismanAttachments(removedFamiliarId) {
        let changed = false;
        for (const talId in state.talismans) {
            if (state.talismans[talId] === removedFamiliarId) {
                state.talismans[talId] = ""; 
                changed = true;
            }
        }
        if (changed) {
            renderTalismans();
        }
    }

    function renderSpecials() {
        els.signatureGrid.innerHTML = '';
        els.specialsGrid.innerHTML = '';
        if (!state.dominion || !state.champion) return;

        const availableSpecials = db.specials.filter(s => {
            const matchesDominion = s.dominion === state.dominion;
            const matchesChamp = s.isSignature ? s.tiedChampionId === state.champion : true;
            return matchesDominion && matchesChamp;
        });

        if (availableSpecials.length === 0) {
            els.specialsGrid.innerHTML = '<span class="empty-message">No special actions found.</span>';
            els.signatureContainer.classList.add('hidden');
            return;
        }

        const signatureSpecials = availableSpecials.filter(s => s.isSignature);
        const genericSpecials = availableSpecials.filter(s => !s.isSignature);

        if (signatureSpecials.length === 0) {
            els.signatureContainer.classList.add('hidden');
        } else {
            els.signatureContainer.classList.remove('hidden');
        }

        // Helper to render an action card into a specific grid
        const renderActionCard = (action, grid) => {
            const container = document.createElement('div');
            container.className = 'card-container';

            const isSelected = state.specials.includes(action.id);
            const canCheck = isSelected || state.specials.length < MAX_SPECIALS;

            const cardEl = document.createElement('div');
            cardEl.className = `visual-card ${isSelected ? 'selected' : ''}`;
            cardEl.style.cssText = getCardStyle(action);
            cardEl.setAttribute('title', `${action.name} ${action.isSignature ? '(Signature)' : ''} (Cost: ${action.ether || action.cost || 0} Ether)`);

            if (!canCheck && !isSelected) {
                cardEl.style.opacity = '0.4';
                cardEl.style.cursor = 'not-allowed';
            }

            cardEl.addEventListener('click', () => {
                if (isSelected) {
                    state.specials = state.specials.filter(s => s !== action.id);
                } else {
                    if (!canCheck) return;
                    state.specials.push(action.id);
                }
                renderSpecials();
                updateTrackers();
            });

            container.appendChild(cardEl);
            grid.appendChild(container);
        };

        signatureSpecials.forEach(action => renderActionCard(action, els.signatureGrid));
        genericSpecials.forEach(action => renderActionCard(action, els.specialsGrid));
    }

    function updateTrackers() {
        const currentEther = calculateCurrentEther();
        const currentSpecials = state.specials.length;

        els.etherTracker.textContent = `${currentEther} / ${MAX_ETHER}`;
        els.etherTracker.style.color = currentEther > MAX_ETHER ? 'var(--warning-colour)' : 'var(--success-colour)';

        els.specialsTracker.textContent = `${currentSpecials} / ${MAX_SPECIALS}`;
        els.specialsTracker.style.color = currentSpecials === MAX_SPECIALS ? 'var(--success-colour)' : 'var(--warning-colour)';

        evaluateWarnings(currentEther, currentSpecials);
    }

    function evaluateWarnings(currentEther, currentSpecials) {
        els.warningsList.innerHTML = '';
        let hasWarnings = false;

        if (state.dominion && state.champion) {
            if (currentEther <= 35) {
                const li = document.createElement('li');
                li.textContent = `You are ${MAX_ETHER - currentEther} Ether away from the 40 limit.`;
                els.warningsList.appendChild(li);
                hasWarnings = true;
            }

            if (currentSpecials < MAX_SPECIALS) {
                const li = document.createElement('li');
                li.textContent = `You have only selected ${currentSpecials} of your 6 allowed Special Actions.`;
                els.warningsList.appendChild(li);
                hasWarnings = true;
            }

            let missingAttachments = false;
            for (const talId in state.talismans) {
                if (state.talismans[talId] === "") {
                    missingAttachments = true;
                }
            }
            if (missingAttachments) {
                const li = document.createElement('li');
                li.textContent = `You have recruited Talismans that are not attached to a Basic Familiar.`;
                els.warningsList.appendChild(li);
                hasWarnings = true;
            }
        }

        els.warningsBox.style.display = hasWarnings ? 'block' : 'none';
    }

    function getCardStyle(card) {
        if (!card || !card.image) {
            // Default card back
            return 'background-color: #333;';
        }
        const img = card.image;
        const cols = img.cols;
        const rows = img.rows;
        const idx = img.idx;
        
        const col = idx % cols;
        const rowIdx = Math.floor(idx / cols);
        
        const xPercent = cols > 1 ? (col / (cols - 1)) * 100 : 0;
        const yPercent = rows > 1 ? (rowIdx / (rows - 1)) * 100 : 0;
        
        return `
            background-image: url('${img.url}');
            background-size: ${cols * 100}% ${rows * 100}%;
            background-position: ${xPercent}% ${yPercent}%;
        `;
    }

    els.btnExport.addEventListener('click', () => {
        if (!state.dominion || !state.champion) {
            alert('Please select a Dominion and Champion before exporting.');
            return;
        }

        for (const talId in state.talismans) {
            if (state.talismans[talId] === "") {
                alert('Please ensure all recruited Talismans are attached to a Basic Familiar before exporting.');
                return;
            }
        }

        const champObj = db.champions.find(c => c.id === state.champion);

        const exportFamiliars = {};
        const exportFamiliarIds = {};
        for (const [id, qty] of Object.entries(state.familiars)) {
            const unitObj = db.units.find(u => u.id === id);
            if (unitObj) {
                exportFamiliars[unitObj.name] = qty;
                if (unitObj.uniqueId) {
                    exportFamiliarIds[unitObj.uniqueId] = qty;
                }
            }
        }

        const exportTalismans = {};
        const exportTalismanIds = {};
        for (const [id, attachedId] of Object.entries(state.talismans)) {
            const talObj = db.units.find(u => u.id === id);
            const famObj = db.units.find(u => u.id === attachedId);
            if (talObj && famObj) {
                exportTalismans[talObj.name] = `Attached to: ${famObj.name}`;
                if (talObj.uniqueId && famObj.uniqueId) {
                    exportTalismanIds[talObj.uniqueId] = `Attached to: ${famObj.uniqueId}`;
                }
            }
        }

        const exportSpecials = [];
        const exportSpecialIds = [];
        state.specials.forEach(id => {
            const specObj = db.specials.find(s => s.id === id);
            if (specObj) {
                exportSpecials.push(specObj.name);
                if (specObj.uniqueId) {
                    exportSpecialIds.push(specObj.uniqueId);
                }
            } else {
                exportSpecials.push(id);
            }
        });

        const exportData = {
            dominion: state.dominion,
            champion: champObj ? champObj.name : state.champion,
            championId: (champObj && champObj.uniqueId) ? champObj.uniqueId : "",
            unitsRecruited: exportFamiliars,
            unitIdsRecruited: exportFamiliarIds,
            talismansEquipped: exportTalismans,
            talismanIdsEquipped: exportTalismanIds,
            specialActions: exportSpecials,
            specialIds: exportSpecialIds
        };

        const jsonString = JSON.stringify(exportData, null, 2);
        els.exportOutput.value = jsonString;

        navigator.clipboard.writeText(jsonString).then(() => {
            const originalText = els.btnExport.textContent;
            els.btnExport.textContent = 'Copied to Clipboard!';
            els.btnExport.style.backgroundColor = 'var(--success-colour)';
            
            setTimeout(() => {
                els.btnExport.textContent = originalText;
                els.btnExport.style.backgroundColor = 'var(--accent-colour)';
            }, 3000);
        }).catch(err => {
            alert("Failed to copy to clipboard automatically. You can copy the text manually from the box.");
        });
    });

</script>
</body>
</html>
